name: Test installed package and local API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/jep-api
          ref: 45082b3e9e9e81f35596311d6a686ae5fdae5427
          path: .test-api
      - run: python -m pip install build twine '.[test]' -r .test-api/requirements.txt
      - run: python -m pytest -q
        env:
          JEP_API_SOURCE: .test-api
      - run: python -m build && python -m twine check dist/*
  package-coexistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/check_coexistence.py dist/*.whl
